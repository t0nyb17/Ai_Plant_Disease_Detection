<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detection</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lexend:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2a9d8f;
            --secondary-color: #264653;
            --highlight-color: #e9c46a;
            --accent-color: #f4a261;
            --error-color: #e76f51;
            /* ✨ MODIFICATION: Made card slightly more transparent for the new bg */
            --card-bg: rgba(255, 255, 255, 0.8); 
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            /* ✨ MODIFICATION: New font-family */
            font-family: 'Inter', sans-serif;
            
            /* ✨ MODIFICATION: More complex, animated gradient background */
            background: linear-gradient(
                -45deg, 
                var(--secondary-color), 
                var(--primary-color), 
                var(--accent-color), 
                var(--highlight-color)
            );
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;

            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden; /* Prevent all overflow */
        }

        /* ✨ NEW: Keyframes for the animated background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .leaves-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .leaf {
            position: absolute;
            top: -50px; 
            width: 30px;
            height: 30px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 0 70% 0 70%;
            animation: fall 15s linear infinite;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0) rotate(-20deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            50% {
                transform: translateY(50vh) translateX(50px) rotate(340deg);
            }
            100% {
                transform: translateY(110vh) translateX(-50px) rotate(700deg);
                opacity: 0;
            }
        }

        .leaf:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 12s; }
        .leaf:nth-child(2) { left: 20%; animation-delay: -2s; animation-duration: 15s; background-color: rgba(233, 196, 106, 0.3); }
        .leaf:nth-child(3) { left: 30%; animation-delay: -4s; animation-duration: 18s; }
        .leaf:nth-child(4) { left: 40%; animation-delay: -6s; animation-duration: 13s; }
        .leaf:nth-child(5) { left: 50%; animation-delay: -8s; animation-duration: 20s; background-color: rgba(231, 111, 81, 0.3); }
        .leaf:nth-child(6) { left: 60%; animation-delay: -10s; animation-duration: 16s; }
        .leaf:nth-child(7) { left: 70%; animation-delay: -12s; animation-duration: 14s; background-color: rgba(233, 196, 106, 0.3); }
        .leaf:nth-child(8) { left: 80%; animation-delay: -14s; animation-duration: 17s; }
        .leaf:nth-child(9) { left: 90%; animation-delay: -16s; animation-duration: 19s; }
        .leaf:nth-child(10) { left: 5%; animation-delay: -5s; animation-duration: 22s; background-color: rgba(231, 111, 81, 0.3); }


        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
            backdrop-filter: blur(12px); /* ✨ MODIFICATION: Increased blur */
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease-in-out;
            position: relative; /* Needed for pseudo-elements */
            z-index: 1;
            overflow: hidden; /* Needed for pseudo-elements */
        }
        
        /* ✨ NEW: Interactive glow effect that follows the mouse */
        .card::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 80%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            /* Positioned using JS */
            transform: translate(-50%, -50%); 
        }

        .card:hover::before {
            opacity: 1;
        }

        h1 {
            /* ✨ MODIFICATION: New font for heading */
            font-family: 'Lexend', sans-serif; 
            color: var(--secondary-color);
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            margin-bottom: 30px;
            font-size: 1rem;
            color: #555;
            line-height: 1.6;
        }

        #upload-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #file-input {
            display: none;
        }

        .file-input-label {
            background-color: #fff;
            border: 2px dashed var(--primary-color);
            color: var(--primary-color);
            padding: 30px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.05rem;
        }
        
        /* ✨ NEW: Style for the SVG icon */
        .file-input-label svg {
            width: 40px;
            height: 40px;
            stroke: var(--primary-color);
            transition: all 0.3s ease;
        }

        .file-input-label.dragover {
            background-color: var(--primary-color);
            color: #fff;
            border-style: solid;
            transform: scale(1.02);
        }
        
        .file-input-label.dragover svg {
            stroke: #fff;
            transform: translateY(-5px);
        }

        .file-input-label:not(.dragover):hover {
            background-color: rgba(42, 157, 143, 0.05);
            border-style: dashed;
        }
        
        .file-input-label:not(.dragover):hover svg {
            transform: scale(1.1) rotate(-5deg);
        }

        #file-name {
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
        }
        
        #image-preview-container {
            width: 100%;
            max-height: 250px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--primary-color);
            padding: 5px;
            background: #fff;
            margin-top: 5px;
        }

        #image-preview {
            width: 100%;
            height: 100%;
            max-height: 240px;
            object-fit: cover;
            border-radius: 8px;
        }


        button[type="submit"] {
            background: linear-gradient(45deg, var(--primary-color), #2fbaab);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(42, 157, 143, 0.3);
            font-family: 'Lexend', sans-serif;
        }

        button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(42, 157, 143, 0.5);
            filter: brightness(1.1); /* ✨ MODIFICATION: Added brightness on hover */
        }
        
        button[type="submit"]:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(42, 157, 143, 0.3);
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #result {
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 15px;
            border-radius: 12px;
            word-wrap: break-word;
            /* ✨ MODIFICATION: Set up for animation */
            opacity: 0;
        }
        
        /* ✨ NEW: Class to trigger the result animation */
        #result.visible {
            animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #result.prediction {
            background-color: rgba(42, 157, 143, 0.1);
            color: var(--primary-color);
            border: 1px solid rgba(42, 157, 143, 0.3);
        }

        #result.error {
            background-color: rgba(231, 111, 81, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(231, 111, 81, 0.3);
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .card {
                padding: 25px;
            }
            h1 {
                font-size: 1.5rem;
            }
            p {
                font-size: 0.9rem;
                margin-bottom: 20px;
            }
            .leaf {
                width: 20px;
                height: 20px;
            }
            /* ✨ MODIFICATION: Hide the mouse glow on mobile */
            .card::before {
                display: none;
            }
        }
    </style>
</head>

    <div class="leaves-container">

        });

                    imagePreviewContainer.style.display = 'block';

                reader.readAsDataURL(file);

            }
        });

        });

        ['dragleave', 'drop'].forEach(eventName => {
            fileLabel.addEventListener(eventName, () => fileLabel.classList.remove('dragover'), false);
        });

        fileLabel.addEventListener('drop', (e) => {
            fileInput.files = e.dataTransfer.files;
            fileInput.dispatchEvent(new Event('change')); 
        }, false);


        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!fileInput.files[0]) {
                 clearResult();

                 resultDiv.innerText = 'Error: Please select a file to upload.';

                    resultDiv.className = 'error';
                    resultDiv.innerText = `Error: ${result.error || 'Unknown error occurred'}`;
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerText = `Error: Could not connect to the server.`;
                console.error('Fetch Error:', error);
            } finally {
                loader.style.display = 'none';
                resultDiv.classList.add('visible'); // ✨ NEW: Trigger animation
            }
        });

        cardForGlow.addEventListener('mousemove', (e) => {

            cardForGlow.style.setProperty('--mouse-x', `${x}px`);
            cardForGlow.style.setProperty('--mouse-y', `${y}px`);
        });
