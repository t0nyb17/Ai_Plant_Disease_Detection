<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detection</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2a9d8f;
            --secondary-color: #264653;
            --background-light: #f4a261;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #333;
            --error-color: #e76f51;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden; 
        }

        .leaves-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .leaf {
            position: absolute;
            top: -50px; 
            width: 30px;
            height: 30px;
            background-color: rgba(42, 157, 143, 0.7);
            border-radius: 5% 50%;
            animation: fall 15s linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        .leaf:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 12s; }
        .leaf:nth-child(2) { left: 20%; animation-delay: -2s; animation-duration: 15s; background-color: rgba(233, 196, 106, 0.7); }
        .leaf:nth-child(3) { left: 30%; animation-delay: -4s; animation-duration: 18s; }
        .leaf:nth-child(4) { left: 40%; animation-delay: -6s; animation-duration: 13s; }
        .leaf:nth-child(5) { left: 50%; animation-delay: -8s; animation-duration: 20s; background-color: rgba(231, 111, 81, 0.7); }
        .leaf:nth-child(6) { left: 60%; animation-delay: -10s; animation-duration: 16s; }
        .leaf:nth-child(7) { left: 70%; animation-delay: -12s; animation-duration: 14s; background-color: rgba(233, 196, 106, 0.7); }
        .leaf:nth-child(8) { left: 80%; animation-delay: -14s; animation-duration: 17s; }
        .leaf:nth-child(9) { left: 90%; animation-delay: -16s; animation-duration: 19s; }
        .leaf:nth-child(10) { left: 5%; animation-delay: -5s; animation-duration: 22s; background-color: rgba(231, 111, 81, 0.7); }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: var(--secondary-color);
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: #555;
        }

        #upload-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #file-input {
            display: none;
        }

        .file-input-label {
            background-color: #fff;
            border: 2px dashed var(--primary-color);
            color: var(--primary-color);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .file-input-label:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        #file-name {
            font-size: 0.8rem;
            color: #666;
            font-style: italic;
        }

        button[type="submit"] {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        button[type="submit"]:hover {
            background-color: #218175;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #result {
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 15px;
            border-radius: 8px;
            word-wrap: break-word;
        }

        #result.prediction {
            background-color: rgba(42, 157, 143, 0.1);
            color: var(--primary-color);
        }

        #result.error {
            background-color: rgba(231, 111, 81, 0.1);
            color: var(--error-color);
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }

            h1 {
                font-size: 1.5rem;
            }

            p {
                font-size: 0.85rem;
                margin-bottom: 20px;
            }
            
            .leaf {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="leaves-container">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
    </div>

    <main class="card">
        <h1>🌿 Plant Disease Detection</h1>
        <p>Upload a clear image of a plant leaf to identify potential diseases.</p>

        <form id="upload-form" enctype="multipart/form-data" method="post">
            <input type="file" name="file" id="file-input" accept="image/*" required />
            
            <label for="file-input" class="file-input-label">Choose a File</label>
            <span id="file-name">No file chosen</span>

            <button type="submit">Predict</button>
        </form>

        <div id="loader" class="loader" style="display: none;"></div>
        
        <div id="result"></div>
    </main>

    <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('file-input');
        const fileNameSpan = document.getElementById('file-name');
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');
        
       
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileNameSpan.textContent = fileInput.files[0].name;
            } else {
                fileNameSpan.textContent = 'No file chosen';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);

            loader.style.display = 'block';
            resultDiv.innerHTML = '';
            resultDiv.className = ''; // Clear previous classes

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server responded with status: ${response.status}`);
                }

                const result = await response.json();

                if (result.prediction) {
                    resultDiv.className = 'prediction';
                    resultDiv.innerText = `Prediction: ${result.prediction.class} (Confidence: ${(result.prediction.confidence * 100).toFixed(2)}%)`;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerText = `Error: ${result.error || 'Unknown error occurred'}`;
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerText = `Error: Could not connect to the server or an error occurred.`;
                console.error('Fetch Error:', error);
            } finally {

                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
